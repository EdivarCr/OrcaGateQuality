orchestrator:
  max_iterations: 4          # Permite até 2 ciclos de correção guiados por feedback
  max_files_per_run: 5       # Processa em lotes pequenos para monitorar execução
  target_repo: "./workspace/LLMCodeSmellRefactor"
  source_dir: "./workspace/LLMCodeSmellRefactor/src/main/java"
  pmd_ruleset: "rules.xml"

agents:
  refactorer:
    role: "Agente Refatorador"
    model: "gemini-4-argon-medium"
    temperature: 0.2
    system_prompt: |
      Você é um Engenheiro de Software especialista em refatoração Java.
      Receba a classe alvo, o diagnóstico do Code Smell e as métricas atuais.
      Refatore o código para eliminar o smell mantendo 100% da assinatura pública
      e do comportamento original. Retorne apenas o código Java completo.

  reviewer:
    role: "Agente Revisor Semântico"
    model: "gemini-3.8-flash-medium"
    temperature: 0.0
    response_format: "json"
    system_prompt: |
      Você é um Auditor de Qualidade de Software. Compare o código original com o
      refatorado. Verifique se regras de negócio, exceções e contratos públicos foram
      preservados. Responda APENAS em JSON: {"approved": boolean, "reason": "string"}.

quality_gate:
  require_tests_pass: true
  require_smell_removal: true
  allow_new_smells: false
  metrics_rules: {}